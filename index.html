<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fast Draw Photonics — Coming Soon</title>
<meta name="description" content="Fast Draw Photonics. Great things coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#111; --muted:#333; --line:#d9d9d9; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body {
    font-family:'Lato',system-ui,sans-serif; color:var(--ink); background:#fff;
    min-height:100vh; display:flex; flex-direction:column; overflow-x:hidden;
  }
  .bg { position:fixed; inset:0; z-index:-1; overflow:hidden; background:#fff; }
  .bg span { position:absolute; border-radius:50%; filter:blur(90px); opacity:.55; animation:drift 22s ease-in-out infinite alternate; }
  .bg .a { width:45vw; height:45vw; left:-10vw; top:0;   background:#f9c9cf; }
  .bg .b { width:40vw; height:40vw; left:30vw; top:-20vw; background:#fff0b8; animation-delay:-6s; }
  .bg .c { width:45vw; height:45vw; right:-12vw; top:-5vw; background:#cde9fb; animation-delay:-12s; }
  .bg .d { width:50vw; height:30vw; left:20vw; bottom:-15vw; background:#ffffff; opacity:.9; }
  @keyframes drift { to { transform:translate(4vw,3vw) scale(1.08); } }
  @media (prefers-reduced-motion:reduce){ .bg span{animation:none;} }

  header { padding:28px 32px; font-family:'Libre Franklin',sans-serif; font-weight:500; letter-spacing:.08em; text-transform:uppercase; font-size:13px; }
  main { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px 16px; }
  h1 { font-family:'Libre Franklin',sans-serif; font-weight:500; font-size:clamp(40px,7vw,76px); letter-spacing:-.01em; line-height:1.08; }
  .tag { margin-top:28px; font-size:15px; color:var(--muted); max-width:520px; }
  .stealth { display:inline-flex; align-items:center; gap:10px; margin-top:44px; padding:10px 18px; border:1px solid rgba(0,0,0,.15); border-radius:999px;
    font:700 11px 'Lato',sans-serif; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); background:rgba(255,255,255,.6); }
  .dot { width:7px; height:7px; border-radius:50%; background:#111; animation:pulse 2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.25; } }
  .copy { text-align:center; font-size:12px; color:#777; }
  @media (max-width:600px){ header { padding:20px 16px; } }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true"><span class="a"></span><span class="b"></span><span class="c"></span><span class="d"></span></div>

  <header>Fast Draw Photonics</header>

  <main>
    <h1>Great things coming soon.</h1>
    <p class="tag">We&rsquo;re quietly building something new. More to share soon.</p>
    <p class="stealth"><span class="dot"></span>In stealth mode</p>
  </main>

  <footer>
    <p class="copy">&copy; <span id="y"></span> Fast Draw Photonics</p>
  </footer>

<script>
  document.getElementById('y').textContent = new Date().getFullYear();
</script>
</body>
</html>
